<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classic Craps</title>

  <!-- Match your Slots/Blackjack page conventions -->
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="blackjack/bank-chip.css" />
  <link rel="stylesheet" href="craps/craps.css" />
</head>
<body class="craps-page">
  <header class="topbar">
    <div class="left">
      <button class="back-button" id="backButton" type="button">Back</button>
      <div class="title">Classic Craps</div>
    </div>

    <div class="right">
      <div class="user">
        <img id="headerAvatar" class="avatar" alt="avatar" src="assets/images/default-avatar.png" />
        <span id="headerUsername" class="username">Guest</span>
      </div>
      <div id="bankBadge" aria-label="Bank">0</div>
    </div>
  </header>

  <main class="container stack">
    <section class="panel craps-wrap" aria-label="Craps table">
      <div class="craps-head">
        <div>
          <div class="h2">Table</div>
          <div class="muted small" id="phaseLine">Come-out roll</div>
        </div>
        <div class="point-pill" id="pointPill" aria-label="Point">
          <span class="muted">Point</span>
          <strong id="pointValue">—</strong>
        </div>
      </div>

      <div class="table-grid" id="tableGrid" role="group" aria-label="Betting areas">
        <button class="bet-spot" data-bet="pass" type="button">
          <div class="spot-title">PASS LINE</div>
          <div class="spot-meta">Pays 1:1</div>
          <div class="spot-amt"><span class="muted">Bet</span> <strong data-amt="pass">0</strong></div>
        </button>

        <button class="bet-spot" data-bet="dont" type="button">
          <div class="spot-title">DON'T PASS</div>
          <div class="spot-meta">Pays 1:1 (12 push)</div>
          <div class="spot-amt"><span class="muted">Bet</span> <strong data-amt="dont">0</strong></div>
        </button>

        <button class="bet-spot" data-bet="field" type="button">
          <div class="spot-title">FIELD</div>
          <div class="spot-meta">2/12 pay 2:1</div>
          <div class="spot-amt"><span class="muted">Bet</span> <strong data-amt="field">0</strong></div>
        </button>

        <button class="bet-spot" data-bet="any7" type="button">
          <div class="spot-title">ANY 7</div>
          <div class="spot-meta">Pays 4:1</div>
          <div class="spot-amt"><span class="muted">Bet</span> <strong data-amt="any7">0</strong></div>
        </button>
      </div>

      <div class="dice-row" aria-label="Dice">
        <div class="dice" id="dieA" aria-label="Die 1">⚀</div>
        <div class="dice" id="dieB" aria-label="Die 2">⚀</div>

        <div class="roll-info">
          <div class="muted small">Last roll</div>
          <div class="big" id="lastRoll">—</div>
        </div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <!-- Sticky controls area (same idea as Slots) -->
    <section class="grid cols-2" aria-label="Controls">
      <div class="panel">
        <div class="row between">
          <div>
            <div class="muted small">Selected bet</div>
            <div class="big" id="selectedBetLabel">Pass Line</div>
          </div>
          <div>
            <div class="muted small">Total on table</div>
            <div class="big" id="totalBet">0</div>
          </div>
        </div>

        <div class="chip-row" aria-label="Chips">
          <button class="chip-btn chip-5"   data-chip="5"   title="+5" type="button">+5</button>
          <button class="chip-btn chip-25"  data-chip="25"  title="+25" type="button">+25</button>
          <button class="chip-btn chip-100" data-chip="100" title="+100" type="button">+100</button>
        </div>

        <div class="btn-row">
          <button class="btn btn-secondary" id="clearSelectedBtn" type="button">Clear Selected</button>
          <button class="btn btn-secondary" id="clearAllBtn" type="button">Clear All</button>
          <button class="btn btn-secondary" id="resetBankBtn" type="button">Reset Bank</button>
        </div>
      </div>

      <div class="panel">
        <div class="row between">
          <div>
            <div class="muted small">Bank</div>
            <div class="big" id="bankLine">0</div>
          </div>
          <div>
            <div class="muted small">Payout</div>
            <div class="big" id="payoutLine">—</div>
          </div>
        </div>

        <button class="btn btn-primary" id="rollBtn" type="button">Roll</button>
        <div class="muted small mt-2">Tip: click a betting area to select it, then tap chips to add.</div>
      </div>
    </section>
  </main>

  <footer class="footer">© Classic Craps</footer>

  <script>
    // Mirror your Slots header helper
    (function () {
      const avatar = document.getElementById('headerAvatar');
      const usernameEl = document.getElementById('headerUsername');
      const storedName = localStorage.getItem('bj21.username');
      const storedAvatar = localStorage.getItem('bj21.avatar');
      const username = storedName || `Guest_${Math.floor(1000 + Math.random() * 9000)}`;
      usernameEl.textContent = username;
      localStorage.setItem('bj21.username', username);
      if (storedAvatar) avatar.src = storedAvatar;

      window.addEventListener('storage', (e) => {
        if (e.key === 'bj21.avatar' && e.newValue) avatar.src = e.newValue;
      });
    })();
  </script>
  <script src="craps/craps.js"></script>
</body>
</html>
